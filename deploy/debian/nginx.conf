worker_processes 1;
pid /run/mihomo-manager-web/nginx.pid;
error_log stderr warn;
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    # Request URLs can contain Controller WebSocket tokens.
    error_log /dev/null crit;
    sendfile on;
    client_max_body_size 8m;
    client_body_temp_path /run/mihomo-manager-web/body;
    proxy_temp_path /run/mihomo-manager-web/proxy;
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    server {
        listen 0.0.0.0:9090;
        server_name _;
        root /opt/mihomo-manager/app/frontend/dist;
        auth_request /_access_check;
        error_page 401 = @access_required;
        error_page 403 = @access_forbidden;
        error_page 500 = @access_unavailable;
        error_page 418 = @controller_stream;
        location = /_access_check {
            internal;
            auth_request off;
            proxy_pass http://__SYSINFO_UPSTREAM__/access/verify;
            proxy_pass_request_body off;
            proxy_set_header Content-Length '';
            proxy_set_header X-Access-Method $request_method;
            proxy_set_header X-Access-Origin $http_origin;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location @access_required {
            auth_request off;
            default_type application/json;
            add_header X-Access-State required always;
            add_header Cache-Control no-store always;
            return 401 '{"error":"access_required"}';
        }
        location @access_forbidden {
            auth_request off;
            default_type application/json;
            return 403 '{"error":"invalid_origin"}';
        }
        location @access_unavailable {
            auth_request off;
            default_type application/json;
            add_header X-Access-State unavailable always;
            add_header Cache-Control no-store always;
            return 503 '{"error":"access_unavailable"}';
        }
        location ~ ^/api/access/(status|login|enable|password|disable|logout)$ {
            auth_request off;
            rewrite ^/api/access/(.*)$ /access/$1 break;
            proxy_pass http://__SYSINFO_UPSTREAM__;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /api/access/ { return 404; }
        location ~ ^/api/system/(access|stream)(/|$) { return 404; }
        location ~ ^/api/(controller/(traffic|memory|logs)|config/changes|logs/stream)$ {
            rewrite ^/api/(.*)$ /stream/$1 break;
            proxy_pass http://__SYSINFO_UPSTREAM__;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 24h;
        }
        location @controller_stream {
            rewrite ^/api/controller/(.*)$ /stream/controller/$1 break;
            proxy_pass http://__SYSINFO_UPSTREAM__;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 24h;
        }
        location / {
            auth_request off;
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }
        location /assets/ {
            auth_request off;
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        location /api/controller/ {
            if ($http_upgrade != '') { return 418; }
            proxy_pass http://127.0.0.1:19090/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_read_timeout 24h;
        }
        location /api/config/ {
            proxy_pass http://127.0.0.1:9081/;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_read_timeout 24h;
        }
        location /api/logs/ {
            proxy_pass http://127.0.0.1:9082/;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_read_timeout 24h;
        }
        location /api/system/ {
            client_max_body_size 128m;
            proxy_pass http://__SYSINFO_UPSTREAM__/;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
